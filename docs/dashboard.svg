<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="system-monitor dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg)"/>

  <rect x="24" y="24" width="912" height="56" rx="12" fill="#1a2332" stroke="#2d3a4f"/>
  <text x="44" y="58" fill="#e8edf4" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">System Monitor</text>
  <circle cx="820" cy="52" r="5" fill="#22c55e"/>
  <text x="834" y="57" fill="#8b9cb3" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Online</text>

  <rect x="24" y="96" width="912" height="112" rx="12" fill="#1a2332" stroke="#2d3a4f"/>
  <text x="44" y="122" fill="#8b9cb3" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Hardware</text>

  <rect x="44" y="136" width="160" height="56" rx="8" fill="#243044" stroke="#2d3a4f"/>
  <rect x="220" y="136" width="250" height="56" rx="8" fill="#243044" stroke="#2d3a4f"/>
  <rect x="486" y="136" width="160" height="56" rx="8" fill="#243044" stroke="#2d3a4f"/>
  <rect x="662" y="136" width="120" height="56" rx="8" fill="#243044" stroke="#2d3a4f"/>

  <text x="56" y="158" fill="#8b9cb3" font-size="11" font-family="Segoe UI, system-ui, sans-serif">CPU</text>
  <text x="56" y="178" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">42%</text>

  <text x="232" y="158" fill="#8b9cb3" font-size="11" font-family="Segoe UI, system-ui, sans-serif">Memory</text>
  <text x="232" y="178" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">12.4 / 32 GB</text>

  <text x="498" y="158" fill="#8b9cb3" font-size="11" font-family="Segoe UI, system-ui, sans-serif">Disks</text>
  <text x="498" y="178" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">SSD / NVMe / HDD</text>

  <text x="674" y="158" fill="#8b9cb3" font-size="11" font-family="Segoe UI, system-ui, sans-serif">GPU</text>
  <text x="674" y="178" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">8 / 12 GB VRAM</text>

  <rect x="24" y="224" width="440" height="160" rx="12" fill="#1a2332" stroke="#2d3a4f" filter="url(#shadow)"/>
  <rect x="496" y="224" width="440" height="160" rx="12" fill="#1a2332" stroke="#2d3a4f" filter="url(#shadow)"/>

  <text x="44" y="250" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">System Load</text>
  <text x="516" y="250" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">Disk Usage</text>

  <path d="M44 340 C120 300, 180 360, 250 320 S360 280, 444 310" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M44 350 C120 330, 200 370, 280 340 S380 300, 444 330" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="44" y="368" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">CPU</text>
  <text x="100" y="368" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">RAM</text>

  <!-- Disk Usage bars -->
  <rect x="540" y="268" width="52" height="72" rx="6" fill="#243044"/>
  <rect x="540" y="304" width="52" height="36" rx="6" fill="#22c55e"/>
  <text x="566" y="358" text-anchor="middle" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">C:</text>
  <text x="566" y="294" text-anchor="middle" fill="#e8edf4" font-size="11" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">38%</text>

  <rect x="620" y="268" width="52" height="72" rx="6" fill="#243044"/>
  <rect x="620" y="284" width="52" height="56" rx="6" fill="#f59e0b"/>
  <text x="646" y="358" text-anchor="middle" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">D:</text>
  <text x="646" y="278" text-anchor="middle" fill="#e8edf4" font-size="11" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">72%</text>

  <rect x="700" y="268" width="52" height="72" rx="6" fill="#243044"/>
  <rect x="700" y="298" width="52" height="42" rx="6" fill="#3b82f6"/>
  <text x="726" y="358" text-anchor="middle" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">/</text>
  <text x="726" y="292" text-anchor="middle" fill="#e8edf4" font-size="11" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">54%</text>

  <rect x="780" y="268" width="52" height="72" rx="6" fill="#243044"/>
  <rect x="780" y="312" width="52" height="28" rx="6" fill="#22c55e"/>
  <text x="806" y="358" text-anchor="middle" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">/home</text>
  <text x="806" y="306" text-anchor="middle" fill="#e8edf4" font-size="11" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">21%</text>

  <rect x="860" y="268" width="52" height="72" rx="6" fill="#243044"/>
  <rect x="860" y="290" width="52" height="50" rx="6" fill="#ef4444"/>
  <text x="886" y="358" text-anchor="middle" fill="#8b9cb3" font-size="10" font-family="Segoe UI, system-ui, sans-serif">NVMe</text>
  <text x="886" y="284" text-anchor="middle" fill="#e8edf4" font-size="11" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">88%</text>

  <rect x="24" y="400" width="288" height="96" rx="12" fill="#1a2332" stroke="#2d3a4f"/>
  <rect x="336" y="400" width="288" height="96" rx="12" fill="#1a2332" stroke="#2d3a4f"/>
  <rect x="648" y="400" width="288" height="96" rx="12" fill="#1a2332" stroke="#2d3a4f"/>

  <text x="44" y="426" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">CPU</text>
  <text x="356" y="426" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">Memory</text>
  <text x="668" y="426" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">Network</text>

  <circle cx="120" cy="468" r="34" fill="none" stroke="#2d3a4f" stroke-width="10"/>
  <circle cx="120" cy="468" r="34" fill="none" stroke="#22c55e" stroke-width="10" stroke-dasharray="150 214" transform="rotate(-90 120 468)"/>
  <text x="120" y="474" text-anchor="middle" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">42%</text>

  <circle cx="432" cy="468" r="34" fill="none" stroke="#2d3a4f" stroke-width="10"/>
  <circle cx="432" cy="468" r="34" fill="none" stroke="#3b82f6" stroke-width="10" stroke-dasharray="120 214" transform="rotate(-90 432 468)"/>
  <text x="432" y="474" text-anchor="middle" fill="#e8edf4" font-size="14" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">61%</text>

  <path d="M688 470 C740 430, 790 480, 860 450" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <path d="M688 480 C740 460, 790 490, 860 470" fill="none" stroke="#22c55e" stroke-width="3"/>
</svg>
