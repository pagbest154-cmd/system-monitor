[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-monitor"
version = "0.0.7"
description = "Лёгкая система мониторинга с веб-панелью"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
hub = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
grpc = [
    "grpcio>=1.60.0",
]
pi = ["gpiozero>=2.0.0", "smbus2>=0.4.0"]
mqtt = ["paho-mqtt>=2.0.0"]
windows = ["wmi>=1.5.1", "pywin32>=306", "pystray>=0.19.5", "Pillow>=10.0.0"]
agent = []
all = ["system-monitor[hub,grpc,mqtt,pi,windows]"]

[project.scripts]
system-monitor = "system_monitor.__main__:main"
system-monitor-agent = "system_monitor.agent.__main__:main"

[tool.setuptools.packages.find]
include = ["system_monitor*"]
