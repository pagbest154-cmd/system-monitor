services:
  hub:
    build: .
    image: ghcr.io/pagbest154-cmd/system-monitor:${VERSION:-latest}
    container_name: system-monitor-hub
    expose:
      - "8080"
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      HUB_NAME: ${HUB_NAME:?Set HUB_NAME in .env}
      HUB_KEY: ${HUB_KEY:?Set HUB_KEY in .env}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-https://ntfy.sh}
    volumes:
      - ./config:/app/config
      - hub-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: system-monitor-caddy
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: system-monitor-ntfy
    profiles: ["ntfy"]
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost:8090}
    ports:
      - "${NTFY_PORT:-8090}:80"
    volumes:
      - ntfy-data:/var/lib/ntfy
    restart: unless-stopped

volumes:
  hub-data:
  caddy-data:
  caddy-config:
  ntfy-data:
