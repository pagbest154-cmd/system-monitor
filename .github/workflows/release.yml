name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper-compat \
            build-essential \
            devscripts \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-build \
            python3-wheel \
            apt-utils \
            gzip

      - name: Prepare debian files
        run: find debian packaging scripts -type f -exec sed -i 's/\r$//' {} +

      - name: Build deb package
        run: |
          set -euxo pipefail
          chmod +x debian/rules packaging/usrbin-system-monitor
          chmod +x debian/postinst debian/prerm debian/postrm scripts/publish-apt-repo.sh
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          shopt -s nullglob
          deb=(../system-monitor_*_amd64.deb)
          if [ ${#deb[@]} -eq 0 ]; then deb=(../system-monitor_*.deb); fi
          mv "${deb[@]}" dist/
          mv ../system-monitor_*.changes dist/ 2>/dev/null || true
          mv ../system-monitor_*.buildinfo dist/ 2>/dev/null || true

      - name: Build apt repository
        run: |
          chmod +x scripts/publish-apt-repo.sh
          ./scripts/publish-apt-repo.sh dist/system-monitor_*.deb dist/apt-repo

      - name: Extract release notes
        run: |
          chmod +x scripts/extract-release-notes.sh
          version="${GITHUB_REF#refs/tags/v}"
          ./scripts/extract-release-notes.sh "$version" dist/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            dist/system-monitor_*.deb
            dist/system-monitor_*.changes
            dist/apt-repo/**/*

  publish-apt-pages:
    needs: build-deb
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist

      - name: Prepare apt repo for Pages
        run: |
          mkdir -p _site/apt
          cp -a dist/apt-repo/. _site/apt/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
