name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      hub: ${{ steps.detect.outputs.hub }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Detect hub changes since previous tag
        id: detect
        run: |
          chmod +x scripts/detect-hub-changes.sh
          ./scripts/detect-hub-changes.sh

  build-docker:
    needs: detect-changes
    if: needs.detect-changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pagbest154-cmd/system-monitor:${{ needs.detect-changes.outputs.version }}
            ghcr.io/pagbest154-cmd/system-monitor:latest

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[windows]" pyinstaller

      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/build-windows-agent.ps1 -Version ${{ steps.meta.outputs.version }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-agent
          path: packaging/windows/output/*.exe

  build-deb:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper-compat \
            build-essential \
            devscripts \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-build \
            python3-wheel \
            apt-utils \
            gzip

      - name: Prepare debian files
        run: find debian packaging scripts -type f -exec sed -i 's/\r$//' {} +

      - name: Sync deb version from tag
        run: |
          chmod +x scripts/sync-deb-version.sh scripts/publish-apt-repo.sh scripts/extract-release-notes.sh
          ./scripts/sync-deb-version.sh "${{ steps.meta.outputs.version }}"

      - name: Build deb package
        run: |
          set -euxo pipefail
          chmod +x debian/rules packaging/usrbin-system-monitor-agent
          chmod +x debian/system-monitor-agent.postinst debian/system-monitor-agent.prerm debian/system-monitor-agent.postrm
          chmod +x debian/system-monitor-agent.config
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          shopt -s nullglob
          deb=(../system-monitor-agent_*_amd64.deb)
          if [ ${#deb[@]} -eq 0 ]; then deb=(../system-monitor-agent_*.deb); fi
          mv "${deb[@]}" dist/
          mv ../system-monitor-agent_*.changes dist/ 2>/dev/null || true
          mv ../system-monitor-agent_*.buildinfo dist/ 2>/dev/null || true

      - name: Build APT repository
        run: ./scripts/publish-apt-repo.sh dist/system-monitor-agent_*.deb dist/apt-repo

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/

  release:
    needs: [detect-changes, build-docker, build-deb, build-windows]
    if: >-
      always() && !cancelled() &&
      needs.build-deb.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-agent
          path: dist/windows

      - name: Remove existing release (clean re-tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.detect-changes.outputs.version }}
          HUB_BUILT: ${{ needs.build-docker.result == 'success' }}
        run: |
          chmod +x scripts/extract-release-notes.sh
          ./scripts/extract-release-notes.sh "$VERSION" dist/RELEASE_NOTES.md
          {
            echo
            if [ "$HUB_BUILT" = "true" ]; then
              echo "### Docker (hub)"
              echo '```bash'
              echo "docker pull ghcr.io/pagbest154-cmd/system-monitor:${VERSION}"
              echo "docker compose up -d"
              echo '```'
            else
              echo "### Docker (hub)"
              echo "Образ hub не пересобирался — в этом релизе изменений hub-кода нет."
              echo "Используйте предыдущую версию из ghcr.io или \`docker compose pull\` при необходимости."
            fi
            echo
            echo "### Agent (.deb, Linux)"
            echo '```bash'
            echo "sudo apt install ./system-monitor-agent_*_amd64.deb"
            echo '```'
            echo
            echo "### Agent (Windows)"
            echo "Скачайте \`system-monitor-agent_${VERSION}_setup.exe\`, запустите установщик."
            echo "При установке укажите Hub URL, Agent ID и token. Конфиг: \`%ProgramData%\\system-monitor\\agent.yaml\`"
          } >> dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: false
          # Не используйте dist/apt-repo/**/* — .deb в pool дублирует файл из dist/ и ломает re-upload.
          files: |
            dist/system-monitor-agent_*.deb
            dist/system-monitor-agent_*.changes
            dist/apt-repo/dists/**/*
            dist/apt-repo/README.txt
            dist/windows/system-monitor-agent_*_setup.exe

  publish-apt-pages:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist

      - name: Prepare apt repo for Pages
        run: |
          mkdir -p _site/apt
          cp -a dist/apt-repo/. _site/apt/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
