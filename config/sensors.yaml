settings:
  retention_days: 31
  default_interval_sec: 5

sensors:
  - id: cpu_percent
    name: Загрузка процессора
    type: system.cpu_percent
    enabled: true
    interval_sec: 5
    unit: "%"
    warn_above: 80
    critical_above: 95

  - id: ram_used
    name: Использование памяти
    type: system.memory_percent
    enabled: true
    interval_sec: 5
    unit: "%"
    warn_above: 85
    critical_above: 95

  - id: disk_c
    name: "Диск C: (занято)"
    type: system.disk_usage
    enabled: true
    params:
      path: "C:\\"
    interval_sec: 30
    unit: "%"
    warn_above: 85
    critical_above: 95

  - id: net_rx
    name: Сеть — входящий трафик
    type: system.network_bytes
    enabled: true
    params:
      direction: recv
    interval_sec: 5
    unit: "МБ/с"

  - id: net_tx
    name: Сеть — исходящий трафик
    type: system.network_bytes
    enabled: true
    params:
      direction: sent
    interval_sec: 5
    unit: "МБ/с"

  - id: cpu_temp
    name: Температура CPU
    type: system.temperature
    enabled: true
    platforms:
      - windows
      - linux
    interval_sec: 10
    unit: "°C"
    warn_above: 70
    critical_above: 85

  - id: gpu_temp
    name: Температура GPU
    type: system.gpu_temperature
    enabled: true
    platforms:
      - windows
      - linux
    interval_sec: 10
    unit: "°C"
    warn_above: 75
    critical_above: 90

  - id: room_temp
    name: Температура в помещении
    type: gpio.dht22
    enabled: false
    params:
      pin: 4
    interval_sec: 30
    unit: "°C"
    platforms:
      - linux

  - id: ups_voltage
    name: Напряжение ИБП
    type: remote.http_json
    enabled: false
    params:
      url: http://192.168.1.10/api/status
      json_path: voltage
    interval_sec: 60
    unit: В

  - id: mqtt_sensor
    name: MQTT датчик
    type: remote.mqtt
    enabled: false
    params:
      topic: sensors/temperature
      broker: localhost
      port: 1883
    interval_sec: 10
    unit: "°C"
